<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');


.uk-navbar-nav > li > a,
.uk-logo,
#brand-logo a,
.uk-navbar-dropdown-nav a {
    font-family: "Barlow Condensed", sans-serif !important;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}
.uk-navbar-dropdown-nav > li > a {
    font-family: "Barlow Condensed", sans-serif !important;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}
</style>
</head>

<body>

<nav class="uk-navbar-container">
    <div class="uk-container custom-background">
        <div uk-navbar>
            <div class="uk-navbar-left">
              <a href="/" class="uk-navbar-item uk-logo uk-margin-small-right">
				<img th:src="@{/logo.png}" alt="" style="height: 40px;" />
			  </a>
			  <ul id="brand-logo" class="uk-navbar-nav uk-margin-small-right">
                    <li class="uk-text-muted"><a href="">Back Of The Net</a></li>
              </ul>
                <ul class="uk-navbar-nav">
                    <li class="uk-text-muted"><a href="/matches">Matches</a></li>
                    <li class="uk-text-muted"><a href="/league">League</a></li>
                    <li>
                        <a href="/standings">Standings</a>
                        <div class="uk-navbar-dropdown uk-background-primary">	
                            <ul class="uk-nav uk-navbar-dropdown-nav">
                                <li><a href="/standings?open=fifa" data-target="accordion-fifa">FIFA World Cup</a></li>
                                <li><a href="/standings?open=ucl" data-target="accordion-ucl">UEFA Champions League</a></li>
                                <li><a href="/standings?open=euro" data-target="accordion-euro">European Championship</a></li>
                            </ul>
                        </div>
                    </li>
                    <li><a href="/stats">Stats</a></li>
                    <li><a href="/more">More</a></li>
                </ul>

            </div>

        </div>
    </div>
</nav> 	

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    const open = params.get("open");

    if (!open) return;

    const map = {
        fifa: "accordion-fifa",
        ucl: "accordion-ucl",
        euro: "accordion-euro"
    };

    const targetId = map[open];

    if (!targetId) return;

    const target = document.getElementById(targetId);

    if (target) {
        const accordion = UIkit.accordion(target.closest("[uk-accordion]"));
        const index = [...target.parentNode.children].indexOf(target);
        accordion.toggle(index, true);
    }

});
</script>
</body>
</html>
