<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:insert="~{fragments/head}"></div>

<style>
  .uk-card {
    position: relative;
    overflow: hidden;
    opacity: 0.9 !important;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  .uk-card:hover {
    transform: scale(1.05);
    opacity: 1;
  }

  .uk-card-body {
    background-color: #A7C7E7 !important; 
    background-image: url("[[@{/images/soccer-bg.jpg}]]");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    position: relative;
  }

  #more-grid a {
    color: #0047AB !important;
    font-weight: bolder !important;
  }

  .soccer-ball {
    position: absolute;
    width: 28px;
    height: 28px;
    left: 50%;
    top: 50%;
    background-image: url('https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg');
    background-size: cover;
    background-repeat: no-repeat;

    opacity: 0;
    transform: translate(-50%, -50%) scale(.6);

    pointer-events: none;
  }

  .uk-card:hover .soccer-ball {
    animation: kickBall .8s ease-out forwards;
  }

  @keyframes kickBall {

    0% {
        left: 50%;
        top: 50%;
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0deg) scale(.7);
    }

    20% {
        opacity: 1;
    }

    100%{
    left: var(--endX);
    top: var(--endY);
    opacity:0;
    transform:translate(-50%,-50%) rotate(900deg) scale(.9);
}

  }
</style>
	
<body>

<script> 
document.querySelectorAll(".uk-card").forEach(card => {

    card.addEventListener("mouseenter", () => {

        const ball = card.querySelector(".soccer-ball");

        const x = Math.random() > .5 ? "92%" : "8%";
        const y = Math.random() > .5 ? "88%" : "12%";

        ball.style.setProperty("--endX", x);
        ball.style.setProperty("--endY", y);

        ball.style.animation = "none";
        ball.offsetHeight;
        ball.style.animation = "kickBall .75s ease-out forwards";
    });

});
  </script>
